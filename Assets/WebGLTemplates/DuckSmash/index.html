<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fbe6e6; overflow: hidden; font-family: system-ui, sans-serif; }
    #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    /* keep a 9:16 portrait frame that always fits the window */
    #unity-canvas { width: min(100vw, calc(100vh * 9 / 16)); height: min(100vh, calc(100vw * 16 / 9)); display: block;
      border-radius: 14px; box-shadow: 0 10px 40px rgba(60, 40, 90, .25); background: #fbe6e6; touch-action: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #5a4a8a; font-weight: 700; }
    #bar { width: 220px; height: 14px; border-radius: 7px; background: #e9d6ee; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #9a88ee; transition: width .2s; }
    #warn { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loading"><div>Duck Smash</div><div id="bar"><div id="fill"></div></div><div id="lmsg" style="font-weight:600;font-size:14px">Đang tải 0%</div>
    <button id="retry" style="display:none;padding:10px 18px;border:0;border-radius:10px;background:#9a88ee;color:#fff;font-weight:700"
      onclick="location.reload()">Lâu quá? Chạm để tải lại</button>
    <div id="tip" style="font-weight:600;font-size:13px;opacity:.75;max-width:280px;text-align:center"></div></div>
  <div id="warn"></div>
  <script>
    // Audio keep-alive (non-invasive): never replace the browser's AudioContext constructor (that broke sound on
    // phones). Instead, remember every context the engine uses (seen when its nodes connect) and resume it on the
    // next touch / click or when the tab becomes visible again - resume() must come from a user gesture on mobile.
    (function () {
      var AN = window.AudioNode; if (!AN || !AN.prototype || !AN.prototype.connect) return;
      var ctxs = [], orig = AN.prototype.connect;
      AN.prototype.connect = function () { var c = this.context; if (c && ctxs.indexOf(c) < 0) ctxs.push(c); return orig.apply(this, arguments); };
      function wake() {
        if (document.hidden) return;
        for (var i = 0; i < ctxs.length; i++) { var c = ctxs[i]; if (c.state !== "running" && c.state !== "closed") { try { c.resume(); } catch (e) {} } }
      }
      ["touchend", "pointerup", "mouseup", "keydown"].forEach(function (e) { document.addEventListener(e, wake, true); });
      document.addEventListener("visibilitychange", function () { if (!document.hidden) wake(); });
    })();
  </script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    (function () {   // a random tip while loading
      var tips = ["Mẹo: nảy tường rồi phá = điểm x2", "Mẹo: phá 10 món 1 phát → Vịt Bom", "Mẹo: bắn vịt vào vịt để đẩy đi",
                  "Mẹo: phao bơi trượt đi húc vỡ đồ", "Mẹo: bom tắm nổ dây chuyền", "Mẹo: đổ 1 domino, đổ cả dây"];
      document.querySelector("#tip").textContent = tips[Math.floor(Math.random() * tips.length)];
    })();
    function banner(msg, type) {
      var d = document.createElement("div"); d.innerHTML = msg;
      d.style = "padding:8px 12px;border-radius:8px;background:" + (type == "error" ? "#ff8a80" : "#fff59d");
      document.querySelector("#warn").appendChild(d);
      if (type != "error") setTimeout(function () { d.remove(); }, 5000);
    }
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: banner,
    };
    // phones report devicePixelRatio 2-3: rendering at full DPR triples the pixel work, so cap it
    var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, mobile ? 1 : 2);
    var lmsg = document.querySelector("#lmsg"), started = false;
    // if the game hasn't started after a long while (bad network / stale cache), offer a reload
    setTimeout(function () { if (!started) document.querySelector("#retry").style.display = "block"; }, 30000);
    var s = document.createElement("script");
    s.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    s.onerror = function () { lmsg.textContent = "Không tải được game. Kiểm tra mạng rồi tải lại."; document.querySelector("#retry").style.display = "block"; };
    s.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.querySelector("#fill").style.width = (100 * p) + "%";
        lmsg.textContent = p < 0.9 ? "Đang tải " + Math.round(p * 100) + "%" : "Đang khởi động...";
      })
        .then(function () { started = true; document.querySelector("#loading").style.display = "none"; })
        .catch(function (m) { lmsg.textContent = "Lỗi: " + m; document.querySelector("#retry").style.display = "block"; });
    };
    document.body.appendChild(s);
  </script>
</body>
</html>
